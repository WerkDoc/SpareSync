<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>SpareSync</title>
    <meta name="description" content="Werkstatt-Lagerverwaltung für Ersatzteile, Kleinteile und Werkzeuge" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SpareSync" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script>
      // Gespeichertes Erscheinungsbild sofort setzen (vor dem ersten Bild)
      try { var t = localStorage.getItem('wl-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <style>
      /* ---------- Splashscreen: Video ---------- */
      #splash {
        position: fixed; inset: 0; z-index: 9999; overflow: hidden; background: #ffffff;
        display: flex; align-items: center; justify-content: center;
        transition: opacity .5s cubic-bezier(.4, 0, .2, 1);
      }
      #splash.out { opacity: 0; pointer-events: none; }
      #splash video {
        width: 100%; height: 100%; object-fit: contain; display: block; background: #ffffff;
        pointer-events: none; /* kein Antippen, keine iOS-Steuerelemente */
      }
      /* iOS: Play-Symbol-Overlay ausblenden, falls das Video kurz pausiert ist */
      #splash video::-webkit-media-controls, #splash video::-webkit-media-controls-start-playback-button { display: none !important; -webkit-appearance: none; }
      html.splash-on, html.splash-on body { overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <video id="splash-video" src="./splash.mp4" autoplay muted playsinline webkit-playsinline preload="auto"
             disablepictureinpicture disableremoteplayback></video>
    </div>
    <script>
      // Splash: Video bis zum Ende abspielen, dann weich ausblenden und entfernen.
      // Wartet zusätzlich darauf, dass die App fertig geladen ist (window.__appReady).
      (function () {
        var sp = document.getElementById('splash');
        var v = document.getElementById('splash-video');
        if (!sp || !v) return;
        document.documentElement.classList.add('splash-on');
        var videoDone = false;

        window.hideSplash = function () {
          if (!sp || sp.classList.contains('out')) return;
          sp.classList.add('out');
          var remove = function () { if (sp && sp.parentNode) sp.parentNode.removeChild(sp); document.documentElement.classList.remove('splash-on'); };
          sp.addEventListener('transitionend', remove, { once: true });
          setTimeout(remove, 700);
        };
        window.__splashFinish = function () {
          videoDone = true; window.__splashVideoDone = true;
          if (window.__appReady) window.hideSplash();
        };

        // onEnded: Video ist durch
        v.addEventListener('ended', window.__splashFinish);
        // Video fehlt oder ist kaputt → nicht hängen bleiben
        v.addEventListener('error', window.__splashFinish);

        // „Bewegung reduzieren“ am iPhone: Video überspringen
        if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) { v.pause(); window.__splashFinish(); return; }

        // iOS-Stromsparmodus blockiert Autoplay: dann direkt weiter zur App
        var p = v.play && v.play();
        if (p && p.catch) p.catch(function () { window.__splashFinish(); });
        setTimeout(function () { if (!videoDone && v.currentTime === 0) window.__splashFinish(); }, 2500);

        // Sicherheitsnetz: spätestens nach Videolänge + 1,5 s (max. 12 s) weiter
        v.addEventListener('loadedmetadata', function () {
          var ms = isFinite(v.duration) ? Math.min(v.duration * 1000 + 1500, 12000) : 8000;
          setTimeout(window.__splashFinish, ms);
        });
        setTimeout(window.__splashFinish, 12000);
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
