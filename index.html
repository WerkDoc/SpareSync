<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>SpareSync</title>
    <meta name="description" content="Werkstatt-Lagerverwaltung für Ersatzteile, Kleinteile und Werkzeuge" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SpareSync" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script>
      // Gespeichertes Erscheinungsbild sofort setzen (vor dem ersten Bild)
      try { var t = localStorage.getItem('wl-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
      // Design: „plastisch“ (Standard) oder „klassisch“
      try { document.documentElement.dataset.style = localStorage.getItem('ss-style') === 'classic' ? 'classic' : 'neu'; } catch (e) { document.documentElement.dataset.style = 'neu'; }
      // Animationen (voll / reduziert / aus) und Listen-Dichte – aus den Einstellungen
      try {
        var mo = localStorage.getItem('ss-motion');
        if (mo === 'off' || mo === 'reduced') document.documentElement.classList.add('motion-' + mo);
        if (mo === 'off') {
          // „Aus“ wirkt wie „Bewegung reduzieren“ am iPhone – auch für alle Effekte im Code
          var mm0 = window.matchMedia.bind(window);
          window.matchMedia = function (q) {
            if (/prefers-reduced-motion:\s*reduce/.test(q)) return { matches: true, media: q, onchange: null, addEventListener: function () {}, removeEventListener: function () {}, addListener: function () {}, removeListener: function () {}, dispatchEvent: function () { return false; } };
            return mm0(q);
          };
        }
        if (localStorage.getItem('ss-density') === 'compact') document.documentElement.classList.add('dense');
      } catch (e) {}
      // TEST „Vollbild“: App legt sich unter die Statusleiste (wird beim Start der Home-Bildschirm-App gelesen)
      try {
        if (localStorage.getItem('ss-fullbleed') === '1') {
          var sb = document.querySelector('meta[name=apple-mobile-web-app-status-bar-style]');
          if (sb) sb.setAttribute('content', 'black-translucent');
          document.documentElement.classList.add('fullbleed');
        }
      } catch (e) {}
    </script>
    <style>
      /* ---------- Splashscreen: Video ---------- */
      #splash {
        position: fixed; inset: 0; z-index: 9999; overflow: hidden; background: #ffffff;
        display: flex; align-items: center; justify-content: center;
        transition: opacity .5s cubic-bezier(.4, 0, .2, 1);
      }
      #splash.out { opacity: 0; pointer-events: none; }
      #splash { cursor: pointer; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
      #splash .sp-skip {
        position: absolute; left: 0; right: 0; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); text-align: center;
        font: 500 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; letter-spacing: .01em;
        color: #8e8e93; opacity: 0; animation: spSkip .6s ease 1s forwards; pointer-events: none;
      }
      @keyframes spSkip { to { opacity: 1; } }
      #splash video {
        width: 100%; height: 100%; object-fit: contain; display: block; background: #ffffff;
        pointer-events: none; /* kein Antippen, keine iOS-Steuerelemente */
      }
      /* iOS: Play-Symbol-Overlay ausblenden, falls das Video kurz pausiert ist */
      #splash video::-webkit-media-controls, #splash video::-webkit-media-controls-start-playback-button { display: none !important; -webkit-appearance: none; }
      html.splash-on, html.splash-on body { overflow: hidden; }

      /* ---------- Splashscreen im Design „Plastisch“: das S wird aus der Fläche herausgedrückt ---------- */
      #splash .sp-neu { display: none; }
      #splash.neu { background: #e6eaf0; --sh: #c2cad6; --hi: #ffffff; --navy: #0b1735; --blue: #1586dc; }
      html[data-theme="dark"] #splash.neu { background: #17191e; --sh: #0a0b0d; --hi: #22252c; --navy: #f2f2f7; --blue: #3fa9f5; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) #splash.neu { background: #17191e; --sh: #0a0b0d; --hi: #22252c; --navy: #f2f2f7; --blue: #3fa9f5; } }
      #splash.neu .sp-skip { display: none; }
      #splash.neu .sp-neu { display: flex; flex-direction: column; align-items: center; gap: 26px; }
      .sp-disk { position: relative; width: 156px; height: 156px; border-radius: 50%; display: grid; place-items: center; }
      .sp-disk::before, .sp-disk::after { content: ''; position: absolute; inset: 0; border-radius: 50%; }
      .sp-disk::before { box-shadow: inset 9px 9px 18px var(--sh), inset -9px -9px 18px var(--hi); animation: spSink 1.2s cubic-bezier(.4, 0, .2, 1) forwards; }
      .sp-disk::after { opacity: 0; box-shadow: 14px 14px 30px var(--sh), -14px -14px 30px var(--hi); animation: spRaise 1.2s cubic-bezier(.4, 0, .2, 1) forwards; }
      .sp-disk img { position: relative; z-index: 1; width: 74px; height: auto; opacity: .35; transform: scale(.78); animation: spLogo 1.2s cubic-bezier(.34, 1.45, .64, 1) forwards; }
      .sp-word { font: 800 36px/1 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; letter-spacing: -.035em; opacity: 0; transform: translateY(10px); animation: spWord .5s cubic-bezier(.22, 1, .36, 1) .75s forwards; }
      .sp-word span:first-child { color: var(--navy); } .sp-word span:last-child { color: var(--blue); }
      @keyframes spSink { 0%, 25% { opacity: 1; } 60%, 100% { opacity: 0; } }
      @keyframes spRaise { 0%, 30% { opacity: 0; } 70%, 100% { opacity: 1; } }
      @keyframes spLogo { 0%, 22% { opacity: .35; transform: scale(.78); } 65% { opacity: 1; transform: scale(1.08); } 100% { opacity: 1; transform: scale(1); } }
      @keyframes spWord { to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        .sp-disk::before { display: none; } .sp-disk::after { opacity: 1; animation: none; }
        .sp-disk img, .sp-word { opacity: 1; transform: none; animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <video id="splash-video" src="./splash.mp4" autoplay muted playsinline webkit-playsinline preload="auto"
             disablepictureinpicture disableremoteplayback></video>
      <div class="sp-skip">Tippen zum Überspringen</div>
      <div class="sp-neu"><div class="sp-disk"><img src="./brand-s.png" alt=""></div><div class="sp-word"><span>spare</span><span>Sync</span></div></div>
    </div>
    <script>
      // Splash: Video bis zum Ende abspielen, dann weich ausblenden und entfernen.
      // Wartet zusätzlich darauf, dass die App fertig geladen ist (window.__appReady).
      (function () {
        var sp = document.getElementById('splash');
        var v = document.getElementById('splash-video');
        if (!sp || !v) return;
        document.documentElement.classList.add('splash-on');
        // Design „Plastisch“: statt des Videos das plastische Logo (Klassisch behält das Video)
        var neu = document.documentElement.dataset.style === 'neu';
        if (neu) { sp.classList.add('neu'); try { v.pause(); } catch (e) {} if (v.parentNode) v.parentNode.removeChild(v); }
        var videoDone = false;
        var SPEED = 2.2; // Wiedergabe-Tempo: 1 = normal, 1.5 = 50 % schneller

        // Video schneller abspielen
        var setSpeed = function () { try { v.defaultPlaybackRate = SPEED; v.playbackRate = SPEED; } catch (e) {} };
        setSpeed();
        v.addEventListener('loadedmetadata', setSpeed);
        v.addEventListener('play', setSpeed);

        window.hideSplash = function () {
          if (!sp || sp.classList.contains('out')) return;
          sp.classList.add('out');
          var remove = function () { if (sp && sp.parentNode) sp.parentNode.removeChild(sp); document.documentElement.classList.remove('splash-on'); };
          sp.addEventListener('transitionend', remove, { once: true });
          setTimeout(remove, 700);
        };
        window.__splashFinish = function () {
          videoDone = true; window.__splashVideoDone = true;
          if (window.__appReady) window.hideSplash();
        };

        // Antippen = überspringen. Bewusst erst beim „click“ (nach dem Loslassen),
        // damit der Finger nicht versehentlich einen Knopf im Dashboard darunter auslöst.
        var skip = function (e) {
          if (e) { e.preventDefault(); e.stopPropagation(); }
          try { v.pause(); } catch (err) {}
          window.__splashVideoDone = true; videoDone = true;
          window.hideSplash(); // sofort ausblenden, die App lädt im Hintergrund fertig
        };
        sp.addEventListener('click', skip);
        document.addEventListener('keydown', function onKey(e) {
          if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') { document.removeEventListener('keydown', onKey); if (document.getElementById('splash')) skip(e); }
        });

        if (neu) {
          var reducedNeu = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
          setTimeout(window.__splashFinish, reducedNeu ? 250 : 1700);
          return;
        }

        // onEnded: Video ist durch
        v.addEventListener('ended', window.__splashFinish);
        // Video fehlt oder ist kaputt → nicht hängen bleiben
        v.addEventListener('error', window.__splashFinish);

        // „Bewegung reduzieren“ am iPhone: Video überspringen
        if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) { v.pause(); window.__splashFinish(); return; }

        // iOS-Stromsparmodus blockiert Autoplay: dann direkt weiter zur App
        var p = v.play && v.play();
        if (p && p.catch) p.catch(function () { window.__splashFinish(); });
        setTimeout(function () { if (!videoDone && v.currentTime === 0) window.__splashFinish(); }, 2500);

        // Sicherheitsnetz: spätestens nach (beschleunigter) Videolänge + 1,5 s (max. 12 s) weiter
        v.addEventListener('loadedmetadata', function () {
          var ms = isFinite(v.duration) ? Math.min(v.duration * 1000 / SPEED + 1500, 12000) : 8000;
          setTimeout(window.__splashFinish, ms);
        });
        setTimeout(window.__splashFinish, 12000);
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
