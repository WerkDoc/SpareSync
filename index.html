<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>SpareSync</title>
    <meta name="description" content="Werkstatt-Lagerverwaltung für Ersatzteile, Kleinteile und Werkzeuge" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SpareSync" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preload" as="image" href="./brand-s.png" />
    <script>
      // Gespeichertes Erscheinungsbild sofort setzen (vor dem ersten Bild), Startzeit für den Splash merken
      try { var t = localStorage.getItem('wl-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
      window.__splashStart = Date.now();
    </script>
    <style>
      /* ---------- Splashscreen (Variante B: gleitendes S) ---------- */
      #splash {
        --sp-bg: #ffffff; --sp-navy: #0b1735; --sp-blue: #1586dc; --sp-muted: #8a8a90; --wm: 34px;
        position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: var(--sp-bg);
        transition: opacity .55s cubic-bezier(.4, 0, .2, 1), transform .55s cubic-bezier(.4, 0, .2, 1);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #splash { --sp-bg: #000000; --sp-navy: #f2f2f7; --sp-blue: #3fa9f5; } }
      :root[data-theme="dark"] #splash { --sp-bg: #000000; --sp-navy: #f2f2f7; --sp-blue: #3fa9f5; }
      #splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
      #splash .sp-brand { display: inline-flex; align-items: center; }
      #splash .sp-s {
        position: relative; z-index: 2; display: block; height: calc(var(--wm) * 1.42); width: auto; margin-right: calc(var(--wm) * .02);
        opacity: 0; transform: translateX(var(--shift, 0px)) translateY(calc(var(--wm) * .06)) scale(.55) rotate(-160deg);
        animation: spS 1.45s cubic-bezier(.22, 1, .36, 1) .1s forwards;
      }
      #splash .sp-wm {
        position: relative; z-index: 1; display: inline-block; font-weight: 800; font-size: var(--wm); line-height: 1;
        letter-spacing: -.035em; white-space: nowrap; opacity: 0; filter: blur(3px);
        transform: translateX(calc(var(--shift, 0px) * -.6)) scale(.96);
        animation: spText .75s cubic-bezier(.22, 1, .36, 1) .92s forwards;
      }
      #splash .sp-a { color: var(--sp-navy); } #splash .sp-b { color: var(--sp-blue); }
      #splash .sp-tag {
        position: absolute; left: 0; right: 0; bottom: calc(56px + env(safe-area-inset-bottom, 0px)); text-align: center;
        font-size: 13px; font-weight: 500; letter-spacing: .02em; color: var(--sp-muted); opacity: 0;
        animation: spFade .7s ease 1.5s forwards;
      }
      @keyframes spS {
        0%   { opacity: 0; transform: translateX(var(--shift)) translateY(calc(var(--wm) * .06)) scale(.55) rotate(-160deg); }
        40%  { opacity: 1; transform: translateX(var(--shift)) translateY(calc(var(--wm) * .06)) scale(1.08) rotate(0deg); }
        55%  { transform: translateX(var(--shift)) translateY(calc(var(--wm) * .06)) scale(1) rotate(0deg); }
        100% { opacity: 1; transform: translateX(0) translateY(calc(var(--wm) * .06)) scale(1) rotate(0deg); }
      }
      @keyframes spText { 0% { opacity: 0; } 35% { opacity: 1; } 100% { opacity: 1; transform: none; filter: blur(0); } }
      @keyframes spFade { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #splash .sp-s, #splash .sp-wm, #splash .sp-tag { animation-duration: .01s; animation-delay: 0s; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="img" aria-label="SpareSync">
      <span class="sp-brand">
        <img class="sp-s" src="./brand-s.png" alt="" width="45" height="48" />
        <span class="sp-wm" aria-hidden="true"><span class="sp-a">pare</span><span class="sp-b">Sync</span></span>
      </span>
      <div class="sp-tag">Ersatzteile. Bestände. Im Griff.</div>
    </div>
    <script>
      // Das S startet in der Bildmitte: um die halbe Breite von „pareSync“ nach rechts verschoben
      (function () {
        var sp = document.getElementById('splash'); if (!sp) return;
        var wm = sp.querySelector('.sp-wm');
        sp.querySelector('.sp-brand').style.setProperty('--shift', (wm.offsetWidth / 2) + 'px');
        // Sicherheitsnetz: falls die App nicht startet, Splash nach 6 s trotzdem entfernen
        setTimeout(function () { if (window.hideSplash) window.hideSplash(); else { sp.classList.add('out'); setTimeout(function () { sp.remove(); }, 600); } }, 6000);
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
